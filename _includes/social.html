<span class="contact-icon text-center">
  {% if include.compact %}
    <a href="mailto:{{ site.email | encode_email }}" aria-label="Email"><i class="fas fa-envelope" aria-hidden="true"></i></a>
    {% if site.cv_pdf %}<a href="{{ site.cv_pdf | prepend: '/assets/pdf/' | relative_url }}" target="_blank" rel="noopener noreferrer" title="CV" class="cv-link"><span class="cv-link-label">CV</span></a>{% endif %}
  {% else %}
    {% if site.twitter_username %}<a href="https://twitter.com/{{ site.twitter_username | url_encode }}" target="_blank" rel="noopener noreferrer" title="Twitter" aria-label="Twitter"><i class="fab fa-twitter" aria-hidden="true"></i></a>{% endif %}
    {% if site.linkedin_username %}<a href="https://www.linkedin.com/in/{{ site.linkedin_username | url_encode }}" target="_blank" rel="noopener noreferrer" title="LinkedIn" aria-label="LinkedIn"><i class="fab fa-linkedin" aria-hidden="true"></i></a>{% endif %}
    {% if site.scholar_userid %}<a href="https://scholar.google.com/citations?hl=en&amp;user={{ site.scholar_userid | url_encode }}" target="_blank" rel="noopener noreferrer" title="Google Scholar" aria-label="Google Scholar"><i class="ai ai-google-scholar" aria-hidden="true"></i></a>{% endif %}
  {% endif %}
</span>
