---
layout: default
---
<div class="post">
  {% unless page.hide_page_header %}
    <div class="text-left">
      <header class="post-header">
        <h1 class="post-title" style="font-family: 'Source Serif 4', serif;">{{ page.title }}</h1>
        <p class="post-description">{{ page.description }}</p>
      </header>
    </div>
  {% endunless %}
  
  <article>
    {{ content }}
  </article>

</div>
